services:
  api:
    build: .
    command: uvicorn aegis_prompt_studio.api:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ui:
    build: .
    command: streamlit run src/aegis_prompt_studio/ui.py --server.address=0.0.0.0 --server.port=8501
    environment:
      APP_MODE: ${APP_MODE:-demo}
      AEGIS_API_KEY: ${AEGIS_API_KEY:-}
      AEGIS_API_URL: http://api:8000
      MAX_INPUT_CHARS: ${MAX_INPUT_CHARS:-50000}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
